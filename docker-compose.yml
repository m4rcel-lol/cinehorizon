services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cinehorizon
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme_db}
      POSTGRES_DB: cinehorizon
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinehorizon -d cinehorizon"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DB_USER: cinehorizon
      DB_PASSWORD: ${DB_PASSWORD:-changeme_db}
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: cinehorizon
      REDIS_URL: redis://redis:6379
      JWT_PRIVATE_KEY_PATH: /keys/private.pem
      JWT_PUBLIC_KEY_PATH: /keys/public.pem
      BASE_URL: http://localhost:47304
      WEB_ORIGIN: http://localhost:47304
      ADMIN_ORIGIN: http://localhost:47304/admin
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      MEDIA_PUBLIC_URL: http://localhost:47304/media
      LOCAL_MEDIA_DIR: /var/media
    volumes:
      - ./keys:/keys:ro
      - media:/var/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "4000:4000"
    command: node apps/api/scripts/with-docker-db-url.mjs sh -c "pnpm --filter @cinehorizon/db db:push && pnpm --filter @cinehorizon/db db:seed && node apps/api/dist/server.js"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DB_USER: cinehorizon
      DB_PASSWORD: ${DB_PASSWORD:-changeme_db}
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: cinehorizon
      REDIS_URL: redis://redis:6379
      JWT_PRIVATE_KEY_PATH: /keys/private.pem
      JWT_PUBLIC_KEY_PATH: /keys/public.pem
      BASE_URL: http://localhost:47304
      WEB_ORIGIN: http://localhost:47304
      ADMIN_ORIGIN: http://localhost:47304/admin
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      MEDIA_PUBLIC_URL: http://localhost:47304/media
      LOCAL_MEDIA_DIR: /var/media
    volumes:
      - ./keys:/keys:ro
      - media:/var/media
    depends_on:
      api:
        condition: service_healthy
    command: node apps/api/scripts/with-docker-db-url.mjs node apps/api/dist/worker.js

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: /api/v1
    depends_on: [api]

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        VITE_API_URL: /api/v1
    depends_on: [api]

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - media:/usr/share/nginx/html/media:ro
    ports:
      - "47304:80"
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
      admin:
        condition: service_started

volumes:
  pgdata:
  media:
