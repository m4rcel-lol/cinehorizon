events {}
http {
  include /etc/nginx/mime.types;
  sendfile on;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

  upstream api_upstream { server api:4000; }
  upstream web_upstream { server web:80; }
  upstream admin_upstream { server admin:80; }

  server {
    listen 80;
    client_max_body_size 5G;

    # Emit relative Location headers so any redirect keeps the caller's
    # host:port (e.g. :47304) instead of collapsing to the listen port 80.
    absolute_redirect off;

    location /api/ {
      proxy_pass http://api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
      alias /usr/share/nginx/html/media/;
      add_header Cache-Control "private, max-age=3600";
    }

    location /admin {
      proxy_pass http://admin_upstream;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
    }

    location / {
      proxy_pass http://web_upstream;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
    }
  }
}
