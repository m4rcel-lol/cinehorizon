server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # The admin SPA is built with Vite base "/admin/", so its assets are
  # requested at /admin/assets/*. Serve the build from an /admin/ subtree and
  # fall back to the SPA entry point for client-side routes.
  location /admin/ {
    try_files $uri $uri/ /admin/index.html;
  }

  location = /admin {
    return 301 /admin/;
  }
}
