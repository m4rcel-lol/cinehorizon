server {
  listen 80;
  root /usr/share/nginx/html;

  # Emit relative Location headers so redirects keep the caller's host:port
  # (e.g. :47304) instead of collapsing to the container's internal port 80.
  absolute_redirect off;

  # The admin SPA is built with Vite base "/admin/", so its entry HTML and
  # assets live under /usr/share/nginx/html/admin and are requested at
  # /admin/... . Serve everything under /admin directly (no redirect) and fall
  # back to the SPA entry point for client-side routes. Handling the bare
  # /admin path here avoids a redirect that can be dropped across the proxy.
  location /admin {
    try_files $uri /admin/index.html;
  }
}
