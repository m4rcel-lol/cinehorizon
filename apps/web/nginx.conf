server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  # Emit relative Location headers so directory redirects keep the caller's
  # host:port (e.g. :47304) instead of collapsing to the container's port 80.
  absolute_redirect off;
  location / { try_files $uri $uri/ /index.html; }
}
